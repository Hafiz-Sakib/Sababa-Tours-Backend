name: Keep Render Awake

on:
  schedule:
    - cron: "*/10 * * * *" # every 10 minutes (GitHub may delay it a bit)
  workflow_dispatch: # manual run from the Actions tab

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping backend /health
        run: |
          curl -fsS --retry 3 --retry-delay 10 --max-time 90 \
            https://sababa-tours-backend.onrender.com/health
